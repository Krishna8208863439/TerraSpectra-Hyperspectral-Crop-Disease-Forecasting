version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terraspectra-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    volumes:
      - ./backend/app/database:/app/app/database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: terraspectra-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
